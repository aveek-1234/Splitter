version: "3.8"

services:
  splitter-api:
    image: ghcr.io/aveek-1234/splitter-api:${IMAGE_TAG}
    container_name: splitter-api
    depends_on:
      - qdrant
      - ollama
    ports:
      - "5080:5080"
    environment:
      ASPNETCORE_URLS: http://+:5080
      Clerk__Issuer: ${CLERK_JWT_ISSUER_DOMAIN}
      Convex__Url: ${CONVEX_URL}
      Convex__AdminToken: ${CONVEX_ADMIN_TOKEN:-}
      Groq__ApiKey: ${GROQ_API_KEY}
      Qdrant__Url: http://qdrant:6333
      Qdrant__Collection: splitter_embeddings
      Ollama__BaseUrl: http://ollama:11434
      Ollama__EmbedModel: nomic-embed-text
      CLERK_JWT_ISSUER_DOMAIN: ${CLERK_JWT_ISSUER_DOMAIN}
      CONVEX_URL: ${CONVEX_URL}
      GROQ_API_KEY: ${GROQ_API_KEY}
    restart: unless-stopped
    networks:
      - splitter-network

  splitter:
    image: ghcr.io/aveek-1234/splitter:${IMAGE_TAG}
    container_name: splitter-app
    depends_on:
      - splitter-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DOTNET_API_URL: http://splitter-api:5080
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_JWT_ISSUER_DOMAIN: ${CLERK_JWT_ISSUER_DOMAIN}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - splitter-network

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: splitter-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/var/lib/qdrant
    restart: unless-stopped
    networks:
      - splitter-network

  ollama:
    image: ollama/ollama:latest
    container_name: splitter-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - splitter-network

volumes:
  qdrant_data:
  ollama_data:

networks:
  splitter-network:
    driver: bridge
