name: Deploy to VPS + Worker

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: false
        default: "master"

jobs:
  # -----------------------
  # 🧱 BUILD
  # -----------------------
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_CONVEX_URL=${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/splitter:latest
            ghcr.io/${{ github.repository_owner }}/splitter:${{ github.sha }}

      - name: Build Docker Image Only
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            NEXT_PUBLIC_CONVEX_URL=${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

  # -----------------------
  # 🚀 VPS DEPLOY
  # -----------------------
  deploy-vps:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create deployment directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /home/${{ secrets.VPS_USER }}/splitter
      - name: Copy Docker Compose File
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.VPS_USER }}/splitter/"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin


            cd /home/${{ secrets.VPS_USER }}/splitter

            export IMAGE_TAG=${{ github.sha }}

            export NEXT_PUBLIC_CONVEX_URL="${{ secrets.NEXT_PUBLIC_CONVEX_URL }}"
            export NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}"

            export CLERK_SECRET_KEY="${{ secrets.CLERK_SECRET_KEY }}"
            export CLERK_JWT_ISSUER_DOMAIN="${{ secrets.CLERK_JWT_ISSUER_DOMAIN }}"

            export RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}"
            export GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}"

            export INNGEST_EVENT_KEY="${{ secrets.INNGEST_EVENT_KEY }}"
            export INNGEST_SIGNING_KEY="${{ secrets.INNGEST_SIGNING_KEY }}"

            # LangChain / LangGraph agent + LangSmith tracing
            export LANGSMITH_TRACING="${{ secrets.LANGSMITH_TRACING }}"
            export LANGSMITH_API_KEY="${{ secrets.LANGSMITH_API_KEY }}"
            export LANGSMITH_PROJECT="${{ secrets.LANGSMITH_PROJECT }}"
            export LANGSMITH_ENDPOINT="${{ secrets.LANGSMITH_ENDPOINT }}"
            export LANGCHAIN_CALLBACKS_BACKGROUND="${{ secrets.LANGCHAIN_CALLBACKS_BACKGROUND }}"

            docker compose pull

            docker compose up -d --remove-orphans

            until docker exec splitter-ollama ollama list >/dev/null 2>&1
            do
              sleep 2
            done

            docker exec splitter-ollama ollama list | grep nomic-embed-text || \
            docker exec splitter-ollama ollama pull nomic-embed-text
            docker image prune -af
            docker compose ps
  # -----------------------
  # 🌍 WORKER DEPLOY
  # -----------------------
  deploy-worker:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Worker Dependencies
        working-directory: ./splitterhub-edge-auth
        run: npm install

      - name: Install Wrangler
        working-directory: ./splitterhub-edge-auth
        run: npm install wrangler

      - name: Deploy Worker
        working-directory: ./splitterhub-edge-auth
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    # -----------------------
  # ⚡ CONVEX DEPLOY (PROD)
  # -----------------------
  deploy-convex:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Convex CLI
        run: npm install -g convex

      - name: Sync Convex Environment Variables
        run: |
          npx convex env set GROQ_API_KEY "${{ secrets.GROQ_API_KEY }}"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Deploy Convex to Production
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
